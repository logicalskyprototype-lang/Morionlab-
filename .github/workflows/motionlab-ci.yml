name: MotionLab CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'test/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motionlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python and PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  blender-smoke-test:
    name: Blender 3.6 headless smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Blender 3.6.23
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir -p "${{ runner.temp }}/blender"
          tar -xf /tmp/blender.tar.xz -C "${{ runner.temp }}/blender" --strip-components=1
          echo "${{ runner.temp }}/blender" >> "$GITHUB_PATH"
      - name: Verify Blender version
        run: blender --background --python-exit-code 1 --python-expr "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string); assert bpy.app.version[:2] == (3, 6)"
      - name: Run Blender smoke test
        run: blender --background --python-exit-code 1 --python tests/blender/smoke_cube.py


  postgres-integration-tests:
    name: PostgreSQL lease concurrency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motionlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d motionlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply schema migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/motionlab
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests
        env:
          MOTIONLAB_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/motionlab
        run: python -m pytest -q tests/test_postgres_concurrency.py
